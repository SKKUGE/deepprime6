# @package _global_

# example hyperparameter optimization of some experiment with Optuna:
# python train.py -m hparams_search=mnist_optuna experiment=example

defaults:
    - override /hydra/sweeper: optuna

# choose metric which will be optimized by Optuna
# make sure this is the correct name of some metric logged in lightning module!
optimized_metric: "val/pearson_best"

# Sweep-safe dataloader overrides: disable persistent workers and reduce the
# worker count so that sub-processes are fully torn down between trials.
# Without this, 20 persistent workers × 3 loaders accumulate across hundreds
# of trials and exhaust file-descriptor / shared-memory limits (~44 trials).
data:
    dataloader:
        num_workers: 4
        persistent_workers: false

callbacks:
    rich_progress_bar: null

# here we define Optuna hyperparameter search
# it optimizes for value returned from function with @hydra.main decorator
# docs: https://hydra.cc/docs/next/plugins/optuna_sweeper
hydra:
    mode: "MULTIRUN" # set hydra to multirun by default if this config is attached

    sweeper:
        _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

        # storage URL to persist optimization results
        # SQLite backend so trials survive process crashes and can be resumed.
        storage: sqlite:///optuna_sweep_from_scratch.db

        # name of the study to persist optimization results
        study_name: pe6-skw-from-scratch

        # Number of parallel Optuna trials.
        # Recommendation: keep n_jobs=1 for single-GPU setups, even with ≥24 GB
        # VRAM.  Each concurrent trial loads its own model + optimizer into GPU
        # memory, and the search space includes batch_size up to 512, so two
        # trials can easily exceed available VRAM.  The original n_jobs=8 caused
        # crashes at ~44/400 trials due to accumulated DataLoader workers and
        # shared-memory exhaustion.  Increase only when running on multiple GPUs
        # (one trial per GPU) or after constraining the batch_size search range.
        n_jobs: 1

        # 'minimize' or 'maximize' the objective
        direction: maximize

        # total number of runs that will be executed
        n_trials: 400

        # choose Optuna hyperparameter sampler
        # you can choose bayesian sampler (tpe), random search (without optimization), grid sampler, and others
        # docs: https://optuna.readthedocs.io/en/stable/reference/samplers.html
        sampler:
            _target_: optuna.samplers.TPESampler
            seed: 1234
            n_startup_trials:
                10 # number of random sampling runs before optimization starts
                # https://optuna.readthedocs.io/en/stable/reference/samplers/index.html

        # define hyperparameter search space
        params:
            seed: choice(42, 1234, 2024)
            data.batch_size: choice(32, 64, 128, 256, 512)
            model.optimizer.lr: interval(0.0001, 0.01)
            model.scheduler.T_0: choice(10, 20, 30, 40, 50)
            model.scheduler.T_mult: choice(1, 2)
            model.criterion.scale_threshold: interval(2.0, 4.0)
            model.criterion.minimum_scaling_factor: interval(4.0, 6.0)
            model.criterion.alpha: interval(5.0, 7.0)
