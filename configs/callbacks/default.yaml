defaults:
    - model_checkpoint
    - early_stopping
    - model_summary
    - rich_progress_bar
    - _self_

model_checkpoint:
    dirpath: ${paths.output_dir}/checkpoints
    filename: "epoch_{epoch:03d}"
    monitor: "val/pearson_best"
    mode: "max"
    save_last: False
    save_top_k: 1
    auto_insert_metric_name: False

model_summary:
    max_depth: -1
