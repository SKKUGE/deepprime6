# @package _global_

defaults:
    - override /callbacks: default
    - override /data: pe6
    - override /model: pe6_deep_prime_only_vanilla
    - override /trainer: default
    - override /logger: csv

model:
    model_weights:
        requires_grad: True

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: True

task_name: "PE6a-ft"

tags:
    ["6a-ft", "deep-prime-FT"]

data:
    data_dir: ${paths.data_dir}/sample_data.csv
    batch_size: 2

    datafilter:
        PE_types: ["PE6a(+PEmaxCas9)"]

logger:
    wandb:
        offline: False # dev mode
        log_model: True # upload lightning ckpts
