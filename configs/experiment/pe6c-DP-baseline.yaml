# @package _global_

defaults:
    - override /callbacks: default
    - override /data: pe6
    - override /model: pe6_deep_prime_only_vanilla
    - override /trainer: default
    - override /logger: wandb

model:
    model_weights:
        requires_grad: True

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: True

task_name: "PE6c-ft"

tags:
    [
        "6c-standalone-regression",
        "6c-ft",
        "deep-prime-FT",
        "RQ3_Main_Train",
    ]

data:
    data_dir: ${paths.data_dir}/pe6/RQ3/RQ3_Main_Train_raw.parquet
    batch_size: 512

    datafilter:
        PE_types: ["PE6c(+PEmaxCas9)"]

logger:
    wandb:
        offline: False # dev mode
        log_model: True # upload lightning ckpts
