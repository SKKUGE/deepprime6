# @package _global_

defaults:
    - override /callbacks: default
    - override /data: pe6
    - override /model: pe6_deep_prime_only
    - override /trainer: default
    - override /logger: csv

model:
    model_weights:
        requires_grad: True
    optimizer:
        lr: 0.006034198
    scheduler:
        T_0: 20
        T_mult: 2
    criterion:
        scale_threshold: 3.9112
        minimum_scaling_factor: 5.3211
        alpha: 5.3313

train: True
test: True

task_name: "PE6c-ft"
tags: ["6c-ft", "deep-prime-FT"]
seed: 1234

data:
    data_dir: ${paths.data_dir}/processed_data_dedup.parquet
    batch_size: 64
    skip_preprocessing: True
    datasplit:
        group_column: "Guide"
        test_size: 0.2
        val_size: 0.25

    datafilter:
        PE_types: ["PE6c(+PEmaxCas9)"]
