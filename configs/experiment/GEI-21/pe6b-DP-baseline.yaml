# @package _global_

defaults:
- override /callbacks: default
- override /data: pe6
- override /model: pe6_deep_prime_only
- override /trainer: default
- override /logger: csv
model:
  model_weights:
    requires_grad: true
  optimizer:
    lr: 0.0024047
  scheduler:
    T_0: 10
    T_mult: 2
  criterion:
    scale_threshold: 3.3841
    minimum_scaling_factor: 4.1634
    alpha: 6.0362
train: true
test: true
task_name: PE6b-ft
tags:
- 6b-standalone-regression
- 6b-ft
- deep-prime-FT
- RQ3_Main_Train
- GEI-21
data:
  data_dir: ${paths.data_dir}/processed_data_dedup.parquet
  batch_size: 64
  skip_preprocessing: true
  datasplit:
    group_column: Guide
    test_size: 0.2
    val_size: 0.25
  datafilter:
    PE_types:
    - PE6b(+PEmaxCas9)
seed: 1234
