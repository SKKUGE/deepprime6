# @package _global_

defaults:
- override /callbacks: default
- override /data: pe6
- override /model: pe6_deep_prime_only
- override /trainer: default
- override /logger: csv
model:
  model_weights:
    baseline: null
    requires_grad: true
    num_ensemble: 20
  optimizer:
    lr: 0.008274
  scheduler:
    T_0: 30
    T_mult: 1
  criterion:
    scale_threshold: 2.3102
    minimum_scaling_factor: 4.147
    alpha: 5.7984
train: true
test: true
task_name: PE6a-scratch
tags:
- 6a-standalone-regression
- 6a-scratch
- deep-prime-scratch
- RQ3_Main_Train
- GEI-21
- from-scratch
seed: 2024
data:
  data_dir: ${paths.data_dir}/processed_data_dedup.parquet
  batch_size: 128
  skip_preprocessing: true
  datasplit:
    group_column: Guide
    test_size: 0.2
    val_size: 0.25
  datafilter:
    PE_types:
    - PE6a(+PEmaxCas9)
