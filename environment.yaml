name: deepprime6

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pytorch=2.3.1
  - torchvision=0.18.1
  - pytorch-cuda=12.1
  - lightning=2.3.3
  - torchmetrics=1.4.0
  - rich=13.7.1
  - pre-commit=3.7.1
  - pytest=8.2.2
  - numpy=1.26.4
  - pandas=2.1.4
  - pyarrow=17.0.0
  - scikit-learn=1.4.2
  - scipy>=1.11.0
  - matplotlib
  - seaborn=0.13.2
  - statsmodels=0.14.2
  - biopython
  - pyyaml
  - openpyxl
  - tabulate
  - pip>=23
  - pip:
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - hydra-optuna-sweeper==1.2.0
      - optuna==2.10.1
      - wandb==0.22.3
      - rootutils==1.0.7
      # NOTE: genet==0.15.1 metadata pins tensorflow<2.10 and protobuf<=3.20.3, which conflicts
      # with Python 3.11 + tensorflow==2.15.0. After creating the environment, install via:
      #   pip install genet==0.15.1 --no-deps
      - viennarna          # required by genet (PrimeEditor / RNA folding)
      - regex              # required by genet (PAM search)
      - editdistance       # required by genet (UMI analysis)
      - silence-tensorflow # required by genet.predict
      - pysam              # required by ClinVar pegRNA pipeline (FASTA indexing)
      - icecream           # used in src/utils/drawing_utils.py
      - tensorflow==2.15.0
      - protobuf==4.24.4
