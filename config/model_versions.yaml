models:
  deepprime:
    version: "v1.0"
    checkpoint: "src/models/weights/DP_variant_293T_PE2max_epegRNA_Opti_220428"
  deepprime6:
    version: "v6.0"
    checkpoints:
      PE6a: "src/models/weights/DeepPrime6-weights/pe6a_mainft.ckpt"
      PE6b: "src/models/weights/DeepPrime6-weights/pe6b_mainft.ckpt"
      PE6c: "src/models/weights/DeepPrime6-weights/pe6c_mainft.ckpt"
      PEmaxdRNaseH: "src/models/weights/DeepPrime6-weights/pemaxdrnaseh_mainft.ckpt"
    representative_checkpoint: "ensemble_average"
    aggregation: "ensemble"
    preserve_individual_scores: true
    norm_mean: "src/models/weights/DeepPrime6-weights/pe6_mean.csv"
    norm_std: "src/models/weights/DeepPrime6-weights/pe6_std.csv"
  deepprime6_scratch:
    version: "v6.0-scratch"
    checkpoints:
      PE6a: "src/models/weights/DeepPrime6-scratch-weights/pe6a_scratch.ckpt"
      PE6b: "src/models/weights/DeepPrime6-scratch-weights/pe6b_scratch.ckpt"
      PE6c: "src/models/weights/DeepPrime6-scratch-weights/pe6c_scratch.ckpt"
      PEmaxdRNaseH: "src/models/weights/DeepPrime6-scratch-weights/pemaxdrnaseh_scratch.ckpt"
    representative_checkpoint: "ensemble_average"
    aggregation: "ensemble"
    preserve_individual_scores: true
    norm_mean: "src/models/weights/DeepPrime6-scratch-weights/pe6_mean.csv"
    norm_std: "src/models/weights/DeepPrime6-scratch-weights/pe6_std.csv"
  pridict2:
    version: "v2.0"
    checkpoint: "PRIDICT2/trained_models"
    cell_models:
      - "HEK293T"
      - "K562"
    representative_score: "HEK293T"
    required_context_length: 100 # Needs verification with official PRIDICT2 code
    preserve_individual_scores: true

environment:
  python: "3.11"
  cuda: "12.1"
  packages:
    torch: "2.3.1"
    pandas: "2.1.4"
